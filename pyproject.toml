[project]
name = "raglab"
version = "0.1.0"
description = "A hands-on notebook series that teaches Retrieval-Augmented Generation, from scratch to production."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=2.0,<4",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.16,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pypdf>=7,<8",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "chromadb>=1.5,<2",
    "langchain>=1.5,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.8,<2",
    "langchain-chroma>=1.2,<2",
    "langchain-text-splitters>=1.2,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-classic>=1.1,<2",
    "lark>=1.2",
    "rank-bm25>=0.2.2,<0.3",
    "ragas>=0.4,<0.5",
    "httpx>=0.27",
    "ipython>=8.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=6,<7"]
agent = ["langgraph>=1.2,<2"]
prod = [
    "langchain-postgres>=0.0.19",
    "psycopg[binary]>=3.2",
    "fastapi>=0.165",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "jupytext>=1.19,<2",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "playwright>=1.65,<2",
    "fpdf2>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raglab"]
