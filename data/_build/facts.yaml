# Room rates: Standard low season = price_per_night. Other rows are derived in build_corpus.py:
#   Deluxe = Standard x 1.4, Suite = Standard x 2.2, high season = low season x 1.3 (rounded to $5).
room_types:
  - name: Standard
    multiplier: 1.0
    max_guests: 2
  - name: Deluxe
    multiplier: 1.4
    max_guests: 3
  - name: Suite
    multiplier: 2.2
    max_guests: 4
seasons:
  - name: low
    multiplier: 1.0
  - name: high
    multiplier: 1.3

policies:
  "2024":
    effective: 1 January 2024
    free_cancellation_hours: 48
    late_cancellation_fee: the first night's rate
    no_show_fee: the first night's rate
    advance_saver: false
  "2025":
    effective: 1 March 2025
    free_cancellation_hours: 72
    late_cancellation_fee: the first night's rate
    no_show_fee: the full stay
    advance_saver: true
    advance_saver_discount_percent: 15
    group_rooms: 5
    group_cancellation_days: 14

loyalty:
  points_per_dollar: 10
  points_for_free_night: 10000
  points_expire_months: 18
  tiers:
    - name: Member
      nights: 0
      benefits: [faster premium Wi-Fi, member rates 5% below public rates]
    - name: Silver
      nights: 10
      benefits: [10% off dining, late checkout until 1 PM]
    - name: Gold
      nights: 25
      benefits: [room upgrade when available, late checkout until 2 PM, free breakfast]
    - name: Platinum
      nights: 50
      benefits: [guaranteed late checkout until 4 PM, lounge access, one free night every year]
